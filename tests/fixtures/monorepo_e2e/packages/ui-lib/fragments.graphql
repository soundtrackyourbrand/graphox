fragment UserFields on User @public {
  id
  name
  email
  role
  isActive
  viewCount
  createdAt
  updatedAt
  preferences {
    theme
    notifications
    language
  }
}

fragment FragC on User @public {
  id
}

fragment FragB on User @public {
  name
  ...FragC
}

fragment FragA on User @public {
  email
  ...FragB
  ...FragC
}
