type Query {
  user(id: ID!): User
  posts: [Post]
  samlConfig(id: ID!): SAMLConfig
  generateOTP(input: GenerateOTPInput!): GenerateOTPPayload
  account(id: ID!): User
  prices: [Price]
}

type Mutation {
  createPost(title: String!, content: String!): Post
  createManualPlaylist(input: CreateManualPlaylistInput!): Playlist
}

type User {
  id: ID!
  name: String
  email: String
}

type Post {
  id: ID!
  title: String
  content: String
  author: User
}

type SAMLConfig {
  expiresAt: String
  slug: String
}

type GenerateOTPPayload {
  otp: String
  expiresAt: String
}

input GenerateOTPInput {
  phoneNumber: String
}

type Playlist {
  id: ID!
  permissions: [String]
}

input CreateManualPlaylistInput {
  name: String
  trackIds: [ID]
}

type Price {
  id: ID!
  amount: Float
}
