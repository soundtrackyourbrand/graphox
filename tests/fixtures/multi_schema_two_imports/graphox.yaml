projects:
  - schema: ["packages/base/base.graphql", "packages/ext/ext.graphql"]
    include: "packages/ext/*.graphql"
    output_dir: "packages/ext/__generated__"
schema_types:
  - schema: "packages/base/base.graphql"
    output: "packages/base/base-types.ts"
    import: "@my/base-package"
  - schema: ["packages/base/base.graphql", "packages/ext/ext.graphql"]
    output: "packages/ext/ext-types.ts"
    import: "@my/ext-package"
