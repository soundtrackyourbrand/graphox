[package]
name = "graphql-rust"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    ".",
    "plugins/swc",
]

[lib]
doctest = false

[dependencies]
apollo-compiler = "1.31"
clap = { version = "4.5", features = ["derive"] }
dashmap = { version = "6", features = ["rayon"] }
ropey = "1.6"
serde_json = "1.0.149"
tokio = { version = "1.49.0", default-features = false, features = ["rt", "rt-multi-thread", "time", "macros", "io-std", "sync"] }
tower-lsp = { version = "0.20.0" }
tree-sitter = "0.26"
tree-sitter-graphql = "0.1"
tree-sitter-typescript = "0.23.2"
pathdiff = "0.2"
notify = "8.0.0"
notify-debouncer-mini = "0.6"
ntest = "0.9"
ignore = "0.4"
serde = { version = "1.0.228" }
glob = "0.3.3"
globset = "0.4.18"
rayon = "1.11.0"
log = "0.4"
env_logger = "0.10"
regex = "1.12.2"
ahash = {version = "0.8.11", features = ["serde"]}
colored = "3.1.1"
dirs = "5.0"
once_cell = "1.20"
strsim = "0.11"
yaml-rust2 = "0.11.0"
sonic-rs = "0.5.6"

[dev-dependencies]
tempfile = "3.24.0"
tower-service = "0.3.3"
criterion = { version = "0.8", features = ["async_tokio"] }
futures-util = "0.3"
tokio-stream = "0.1"

[[bench]]
name = "processing"
harness = false

[[bench]]
name = "lsp_actions"
harness = false

[[bench]]
name = "utils"
harness = false

[[bench]]
name = "large_schema_definition"
harness = false

[profile.dev]
opt-level = 0
debug = 0 # Set to 1 or 2 for debugging, 0 for fastest builds
split-debuginfo = "unpacked" # Faster linking on macOS
lto = false
incremental = true
codegen-units = 256

# [profile.dev.build-override]
# opt-level = 2

[profile.release]
opt-level = 3
debug = false
split-debuginfo = "packed"
lto = "thin"
strip = true
codegen-units = 1

# Optimize dependencies even in debug mode for faster runtime (e.g. tests)
# This slows down initial build slightly but speeds up iteration
# [profile.dev.package."*"]
# opt-level = 3
