[package]
name = "graphox"
version = "0.8.1"
edition = "2024"
license.workspace = true
publish.workspace = true

[workspace]
members = [
  ".",
  "plugins/swc/rust",
  "crates/graphox-core",
  "crates/graphox-features",
  "crates/graphox-codegen",
  "crates/graphox-lsp",
  "crates/graphox-cli",
]

[workspace.package]
license = "MIT"
# The crates are not published to crates.io; the npm packages are the
# distribution. Set so `cargo publish` refuses rather than relying on nobody
# trying it. A consequence: the per-crate versions under crates/ are not
# maintained and mean nothing — only the root version is bumped on release.
publish = false

[workspace.dependencies]
apollo-compiler = "1.32"
clap = { version = "4.5", features = ["derive"] }
dashmap = { version = "6", features = ["rayon"] }
ropey = "1.6"
serde_json = "1.0.149"
tokio = { version = "1.49.0", default-features = false, features = [
  "rt",
  "rt-multi-thread",
  "time",
  "macros",
  "io-std",
  "sync",
] }
tower-lsp-server = { version = "0.23" }
tree-sitter = "0.26"
tree-sitter-graphql = "0.2"
tree-sitter-typescript = "0.23.2"
pathdiff = "0.2"
notify = "8.0.0"
notify-debouncer-mini = "0.6"
ignore = "0.4"
serde = { version = "1.0.228" }
glob = "0.3.3"
globset = "0.4.18"
rayon = "1.11.0"
log = "0.4"
env_logger = "0.10"
regex = "1.12.2"
ahash = { version = "0.8.11", features = ["serde"] }
colored = "3.1.1"
dirs = "5.0"
once_cell = "1.20"
strsim = "0.11"
yaml-rust2 = "0.11.0"
sonic-rs = { version = "0.5.7", features = ["sort_keys"] }
url = { version = "2.5", features = ["serde"] }
ls-types = "0.0.6"
criterion = { version = "0.8", features = ["async_tokio"] }

[lib]
doctest = false

[features]
bench = ["dep:criterion"]

[dependencies]
graphox-core = { path = "crates/graphox-core" }
graphox-features = { path = "crates/graphox-features" }
graphox-codegen = { path = "crates/graphox-codegen" }
graphox-lsp = { path = "crates/graphox-lsp" }
graphox-cli = { path = "crates/graphox-cli" }
apollo-compiler = { workspace = true }
clap = { workspace = true }
dashmap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower-lsp-server = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-graphql = { workspace = true }
tree-sitter-typescript = { workspace = true }
ignore = { workspace = true }
serde = { workspace = true }
ahash = { workspace = true }
yaml-rust2 = { workspace = true }
criterion = { workspace = true, optional = true }

[dev-dependencies]
# Test-only: used by tests/ and benches/, not by src/.
dirs = { workspace = true }
glob = { workspace = true }
log = { workspace = true }
# Test-only: tests/support uses once_cell::sync::{OnceCell, Lazy}.
once_cell = { workspace = true }
libc = "0.2"
ntest = "0.9"
tempfile = "3.24.0"
tower-service = "0.3.3"
futures-util = "0.3"
sonic-rs = { version = "0.5.7", features = ["sort_keys"] }
tokio-stream = "0.1"

[[bench]]
name = "processing"
harness = false

[[bench]]
name = "lsp_actions"
harness = false

[[bench]]
name = "utils"
harness = false

[[bench]]
name = "large_schema_definition"
harness = false

[[bench]]
name = "workspace_scan"
harness = false

[[bench]]
name = "lsp_cold_start"
harness = false

[[bench]]
name = "cross_project_resolution"
harness = false

[[bench]]
name = "document_editing"
harness = false

[[bench]]
name = "call_hierarchy"
harness = false

[[bench]]
name = "subgraph_slo"
harness = false

[[bench]]
name = "path_classification"
harness = false

[[bench]]
name = "tree_clone"
harness = false

[profile.dev]
opt-level = 0
debug = 0                    # Set to 1 or 2 for debugging, 0 for fastest builds
split-debuginfo = "unpacked" # Faster linking on macOS
lto = false
incremental = true
codegen-units = 32

[profile.dev.build-override]
opt-level = 2

[profile.dev.package."*"]
debug = false # Don't generate debug info for dependencies as we have some heavy ones (apollo-compiler, tower-lsp)

[profile.release]
opt-level = 3
debug = false
split-debuginfo = "packed"
lto = "thin"
strip = true
codegen-units = 1

[patch.crates-io]
# ariadne writes "Unable to fetch source ..." to stderr when a cache cannot
# supply a source, which corrupts the LSP stdio stream. This fork drops those
# three eprintln! calls and changes nothing else: the source is still skipped,
# exactly as upstream does.
#
# Forwarding the error to the caller instead — the obvious fix, and what
# zesterer/ariadne#167 suggested — is not viable. apollo-compiler's Display
# impl for diagnostics maps any write error to fmt::Error, and its cache
# returns NotFound for any FileId outside the SourceMap it was handed, which
# happens whenever a document is validated against a separately validated
# schema. That turns a skipped label into a panic.
#
# Upstream now lives at codeberg.org/zesterer/ariadne. Drop this patch once a
# release carries a fix. Pinned by rev, not branch, so a force-push cannot
# move what we build against.
ariadne = { git = "https://github.com/Pajn/ariadne", rev = "a7939eb010e37039c4b9f140e0908c4bdee8809e" }

# Optimize dependencies even in debug mode for faster runtime (e.g. tests)
# This slows down initial build slightly but speeds up iteration
# [profile.dev.package."*"]
# opt-level = 3
