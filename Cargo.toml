[package]
name = "graphox"
version = "0.7.1"
edition = "2024"

[workspace]
members = [
  ".",
  "plugins/swc/rust",
  "crates/graphox-core",
  "crates/graphox-features",
  "crates/graphox-codegen",
  "crates/graphox-lsp",
  "crates/graphox-cli",
]

[workspace.dependencies]
apollo-compiler = "1.31"
clap = { version = "4.5", features = ["derive"] }
dashmap = { version = "6", features = ["rayon"] }
ropey = "1.6"
serde_json = "1.0.149"
tokio = { version = "1.49.0", default-features = false, features = [
  "rt",
  "rt-multi-thread",
  "time",
  "macros",
  "io-std",
  "sync",
] }
tower-lsp = { version = "0.20.0" }
tree-sitter = "0.26"
tree-sitter-graphql = "0.1"
tree-sitter-typescript = "0.23.2"
pathdiff = "0.2"
notify = "8.0.0"
notify-debouncer-mini = "0.6"
ignore = "0.4"
serde = { version = "1.0.228" }
glob = "0.3.3"
globset = "0.4.18"
rayon = "1.11.0"
log = "0.4"
env_logger = "0.10"
regex = "1.12.2"
ahash = { version = "0.8.11", features = ["serde"] }
colored = "3.1.1"
dirs = "5.0"
once_cell = "1.20"
strsim = "0.11"
yaml-rust2 = "0.11.0"
sonic-rs = { version = "0.5.7", features = ["sort_keys"] }
url = { version = "2.5", features = ["serde"] }
lsp-types = "0.94"
criterion = { version = "0.8", features = ["async_tokio"] }

[lib]
doctest = false

[features]
bench = ["dep:criterion"]

[dependencies]
graphox-core = { path = "crates/graphox-core" }
graphox-features = { path = "crates/graphox-features" }
graphox-codegen = { path = "crates/graphox-codegen" }
graphox-lsp = { path = "crates/graphox-lsp" }
graphox-cli = { path = "crates/graphox-cli" }
apollo-compiler = { workspace = true }
clap = { workspace = true }
dashmap = { workspace = true }
ropey = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower-lsp = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-graphql = { workspace = true }
tree-sitter-typescript = { workspace = true }
pathdiff = { workspace = true }
ignore = { workspace = true }
serde = { workspace = true }
glob = { workspace = true }
globset = { workspace = true }
rayon = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
ahash = { workspace = true }
colored = { workspace = true }
dirs = { workspace = true }
once_cell = { workspace = true }
strsim = { workspace = true }
yaml-rust2 = { workspace = true }
sonic-rs = { workspace = true }
criterion = { workspace = true, optional = true }

[dev-dependencies]
libc = "0.2"
ntest = "0.9"
tempfile = "3.24.0"
tower-service = "0.3.3"
futures-util = "0.3"
sonic-rs = { version = "0.5.7", features = ["sort_keys"] }
tokio-stream = "0.1"

[[bench]]
name = "processing"
harness = false

[[bench]]
name = "lsp_actions"
harness = false

[[bench]]
name = "utils"
harness = false

[[bench]]
name = "large_schema_definition"
harness = false

[[bench]]
name = "workspace_scan"
harness = false

[[bench]]
name = "lsp_cold_start"
harness = false

[[bench]]
name = "cross_project_resolution"
harness = false

[[bench]]
name = "document_editing"
harness = false

[[bench]]
name = "call_hierarchy"
harness = false

[[bench]]
name = "subgraph_slo"
harness = false

[[bench]]
name = "path_classification"
harness = false

[[bench]]
name = "tree_clone"
harness = false

[profile.dev]
opt-level = 0
debug = 0                    # Set to 1 or 2 for debugging, 0 for fastest builds
split-debuginfo = "unpacked" # Faster linking on macOS
lto = false
incremental = true
codegen-units = 32

[profile.dev.build-override]
opt-level = 2

[profile.dev.package."*"]
debug = false # Don't generate debug info for dependencies as we have some heavy ones (apollo-compiler, tower-lsp)

[profile.release]
opt-level = 3
debug = false
split-debuginfo = "packed"
lto = "thin"
strip = true
codegen-units = 1

[patch.crates-io]
ariadne = { git = "https://github.com/Pajn/ariadne", branch = "5-1" }

# Optimize dependencies even in debug mode for faster runtime (e.g. tests)
# This slows down initial build slightly but speeds up iteration
# [profile.dev.package."*"]
# opt-level = 3
