[package]
name = "graphql-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
apollo-compiler = "1.31"
clap = { version = "4.5", features = ["derive"] }
dashmap = "6"
ropey = "1.6"
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }
tower-lsp = { version = "0.20.0" }
tree-sitter = "0.26"
tree-sitter-graphql = "0.1"
tree-sitter-typescript = "0.23.2"
walkdir = "2.5"
pathdiff = "0.2"

[dev-dependencies]
tower-service = "0.3.3"
