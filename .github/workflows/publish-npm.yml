name: Publish NPM Package

on:
  release:
    types: [published]

jobs:
  publish-npm:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
          cache-dependency-path: npm/graphql-rust-cli/pnpm-lock.yaml
          registry-url: 'https://npm.pkg.github.com'
          scope: '@YOUR_USERNAME'

      - name: Configure package for GitHub Packages
        working-directory: npm/graphql-rust-cli
        run: |
          # Update package name to include scope for GitHub Packages
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.name = '@YOUR_USERNAME/graphql-rust-cli';
          pkg.publishConfig = { registry: 'https://npm.pkg.github.com' };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Publish to GitHub Packages
        working-directory: npm/graphql-rust-cli
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm-public:
    name: Publish to NPM Registry (Optional)
    runs-on: ubuntu-latest
    if: github.event.release.prerelease == false
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
          cache-dependency-path: npm/graphql-rust-cli/pnpm-lock.yaml
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to NPM
        working-directory: npm/graphql-rust-cli
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
