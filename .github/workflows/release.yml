name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubicloud-standard-2-ubuntu-2404
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          # Populates the body from merged pull requests since the previous tag.
          # Set on the asset-upload step too: that updates the same release, and
          # append_body defaults to overwriting, so the last write has to
          # generate them as well or the body ends up empty.
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-binaries:
    name: Build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux x86_64
          - os: ubicloud-standard-4-ubuntu-2404
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          # Linux ARM64
          - os: ubicloud-standard-4-ubuntu-2404
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          # macOS x86_64
          - os: warp-macos-26-arm64-6x
            target: x86_64-apple-darwin
            archive: tar.gz
          # macOS ARM64
          - os: warp-macos-26-arm64-6x
            target: aarch64-apple-darwin
            archive: tar.gz
          # Windows x86_64
          - os: warp-windows-2025-x64-4x
            target: x86_64-pc-windows-msvc
            archive: zip
          # Windows ARM64
          - os: warp-windows-2025-x64-4x
            target: aarch64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""
          target: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Create archive (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../graphox-${{ matrix.target }}.tar.gz graphox
          cd ../../..

      - name: Create archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          if (Test-Path graphox.exe) {
            Compress-Archive -Path graphox.exe -DestinationPath ../../../graphox-${{ matrix.target }}.zip
          } else {
            Compress-Archive -Path graphox -DestinationPath ../../../graphox-${{ matrix.target }}.zip
          }
          cd ../../..

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: ./graphox-${{ matrix.target }}.${{ matrix.archive }}
          retention-days: 1
          if-no-files-found: error

  build-and-publish-swc-plugin:
    name: Build and Publish SWC Plugin
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          scope: '@graphox'
          cache: 'pnpm'
          cache-dependency-path: plugins/swc/node/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: plugins/swc/node
        run: pnpm install --frozen-lockfile

      - name: Build WASM
        working-directory: plugins/swc/node
        run: pnpm run build:wasm

      - name: List WASM files
        run: ls -la plugins/swc/node/wasm/

      - name: Build TypeScript
        working-directory: plugins/swc/node
        run: pnpm run build

      - name: Smoke Test
        working-directory: plugins/swc/node
        run: |
          node -e "
          import('./dist/index.js').then((mod) => {
            const isAvailable = mod.isWasmAvailable();
            if (!isAvailable) {
              console.error('Smoke test failed: WASM plugin not found in built package');
              process.exit(1);
            }
            console.log('Smoke test passed: WASM plugin is available');
          }).catch(err => {
            console.error('Smoke test failed to run:', err);
            process.exit(1);
          });
          "

      - name: Sync package version
        working-directory: plugins/swc/node
        run: |
          VERSION=${{ needs.create-release.outputs.version }}
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '$VERSION';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Publish SWC Plugin
        working-directory: plugins/swc/node
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Upload WASM Artifact for Release
        uses: actions/upload-artifact@v7
        with:
          name: swc-wasm
          path: plugins/swc/node/wasm/
          retention-days: 1
          if-no-files-found: error

  publish-babel-plugin:
    name: Publish Babel Plugin
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          scope: '@graphox'
          cache: 'pnpm'
          cache-dependency-path: plugins/babel/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: plugins/babel
        run: pnpm install --frozen-lockfile

      - name: Sync package version
        working-directory: plugins/babel
        run: |
          VERSION=${{ needs.create-release.outputs.version }}
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '$VERSION';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Publish Babel Plugin
        working-directory: plugins/babel
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-vscode-extension:
    name: Build VSCode Extension
    needs: create-release
    runs-on: ubicloud-standard-2-ubuntu-2404
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: editors/vscode/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: editors/vscode
        run: pnpm install --frozen-lockfile

      - name: Compile extension
        working-directory: editors/vscode
        run: pnpm run compile

      - name: Package extension
        working-directory: editors/vscode
        run: pnpm run package
        env:
          VSCE_PACKAGE_MANAGER: pnpm

      - name: Upload VSCode Extension Artifact
        uses: actions/upload-artifact@v7
        with:
          name: vscode-extension
          path: editors/vscode/*.vsix
          retention-days: 1
          if-no-files-found: error

  publish-platform-packages:
    name: Publish Platform Packages
    needs: [create-release, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            platform: linux-x64
            os: linux
            cpu: x64
          - target: aarch64-unknown-linux-gnu
            platform: linux-arm64
            os: linux
            cpu: arm64
          - target: x86_64-apple-darwin
            platform: darwin-x64
            os: darwin
            cpu: x64
          - target: aarch64-apple-darwin
            platform: darwin-arm64
            os: darwin
            cpu: arm64
          - target: x86_64-pc-windows-msvc
            platform: win32-x64
            os: win32
            cpu: x64
            ext: .exe
          - target: aarch64-pc-windows-msvc
            platform: win32-arm64
            os: win32
            cpu: arm64
            ext: .exe

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          scope: '@graphox'

      - name: Download Binary Artifact
        uses: actions/download-artifact@v8
        with:
          name: binary-${{ matrix.target }}
          path: ./

      - name: Extract Binary
        run: |
          mkdir -p package/bin
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            unzip graphox-${{ matrix.target }}.zip -d package/bin
          else
            tar -xzf graphox-${{ matrix.target }}.tar.gz -C package/bin
          fi

      - name: Prepare Package
        run: |
          VERSION=${{ needs.create-release.outputs.version }}
          sed "s/\${platform}/${{ matrix.platform }}/g; s/\${version}/${VERSION}/g; s/\${os}/${{ matrix.os }}/g; s/\${cpu}/${{ matrix.cpu }}/g; s/\${ext}/${{ matrix.ext || '' }}/g" npm/platforms/package.json.template > package/package.json
          cp README.md LICENSE package/

      - name: Publish
        working-directory: package
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-cli-wrapper:
    name: Publish CLI Wrapper
    needs: [create-release, publish-platform-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          scope: '@graphox'

      - name: Sync package version
        working-directory: npm/graphox-cli
        run: |
          VERSION=${{ needs.create-release.outputs.version }}
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '$VERSION';
          if (pkg.optionalDependencies) {
            Object.keys(pkg.optionalDependencies).forEach(dep => {
              pkg.optionalDependencies[dep] = '$VERSION';
            });
          }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Publish CLI Wrapper
        working-directory: npm/graphox-cli
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  finalize-release:
    name: Finalize GitHub Release
    needs:
      [
        create-release,
        build-binaries,
        build-and-publish-swc-plugin,
        build-vscode-extension,
        publish-babel-plugin,
        publish-platform-packages,
        publish-cli-wrapper,
      ]
    runs-on: ubicloud-standard-2-ubuntu-2404
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: Upload Assets to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ./artifacts/binary-*/*
            ./artifacts/swc-wasm/*.wasm
            ./artifacts/vscode-extension/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
