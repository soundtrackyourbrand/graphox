name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  packages: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ github.ref }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-binaries:
    name: Build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          # Linux ARM64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          # macOS x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          # macOS ARM64
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          # Windows ARM64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Create archive (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../graphox-${{ matrix.target }}.tar.gz graphox
          cd ../../..

      - name: Create archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          if (Test-Path graphox.exe) {
            Compress-Archive -Path graphox.exe -DestinationPath ../../../graphox-${{ matrix.target }}.zip
          } else {
            Compress-Archive -Path graphox -DestinationPath ../../../graphox-${{ matrix.target }}.zip
          }
          cd ../../..

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: ./graphox-${{ matrix.target }}.${{ matrix.archive }}
          retention-days: 1

  build-swc-wasm:
    name: Build SWC WASM Plugin
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: plugins/swc/node/pnpm-lock.yaml

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        working-directory: plugins/swc/node
        run: pnpm install --frozen-lockfile

      - name: Build WASM
        working-directory: plugins/swc/node
        run: pnpm run build:wasm
      
      - name: Upload WASM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: swc-wasm
          path: plugins/swc/node/wasm/graphox_swc_plugin.wasm
          retention-days: 1

  build-vscode-extension:
    name: Build VSCode Extension
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: editors/vscode/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: editors/vscode
        run: pnpm install --frozen-lockfile

      - name: Compile extension
        working-directory: editors/vscode
        run: pnpm run compile

      - name: Package extension
        working-directory: editors/vscode
        run: pnpm run package

      - name: Upload VSCode Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: editors/vscode/*.vsix
          retention-days: 1

  publish-platform-packages:
    name: Publish Platform Packages
    needs: [create-release, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            platform: linux-x64
            os: linux
            cpu: x64
          - target: aarch64-unknown-linux-gnu
            platform: linux-arm64
            os: linux
            cpu: arm64
          - target: x86_64-apple-darwin
            platform: darwin-x64
            os: darwin
            cpu: x64
          - target: aarch64-apple-darwin
            platform: darwin-arm64
            os: darwin
            cpu: arm64
          - target: x86_64-pc-windows-msvc
            platform: win32-x64
            os: win32
            cpu: x64
            ext: .exe
          - target: aarch64-pc-windows-msvc
            platform: win32-arm64
            os: win32
            cpu: arm64
            ext: .exe

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@soundtrack'

      - name: Download Binary Artifact
        uses: actions/download-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: ./

      - name: Extract Binary
        run: |
          mkdir -p package/bin
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            unzip graphox-${{ matrix.target }}.zip -d package/bin
          else
            tar -xzf graphox-${{ matrix.target }}.tar.gz -C package/bin
          fi

      - name: Prepare Package
        run: |
          VERSION=${{ needs.create-release.outputs.version }}
          sed "s/\${platform}/${{ matrix.platform }}/g; s/\${version}/${VERSION}/g; s/\${os}/${{ matrix.os }}/g; s/\${cpu}/${{ matrix.cpu }}/g; s/\${ext}/${{ matrix.ext || '' }}/g" npm/platforms/package.json.template > package/package.json
          cp README.md package/

      - name: Publish
        working-directory: package
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-cli-wrapper:
    name: Publish CLI Wrapper
    needs: [create-release, publish-platform-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@soundtrack'

      - name: Configure package version
        working-directory: npm/graphox-cli
        run: |
          VERSION=${{ needs.create-release.outputs.version }}
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '$VERSION';
          Object.keys(pkg.optionalDependencies).forEach(dep => {
            pkg.optionalDependencies[dep] = '$VERSION';
          });
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Publish CLI Wrapper
        working-directory: npm/graphox-cli
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-swc-plugin-github:
    name: Publish SWC Plugin to GitHub Packages
    needs: [create-release, build-swc-wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Download WASM Artifact
        uses: actions/download-artifact@v4
        with:
          name: swc-wasm
          path: plugins/swc/node/wasm/
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: plugins/swc/node/pnpm-lock.yaml
          registry-url: 'https://npm.pkg.github.com'
          scope: '@soundtrack'

      - name: Install dependencies
        working-directory: plugins/swc/node
        run: pnpm install --frozen-lockfile
      
      - name: Build TypeScript
        working-directory: plugins/swc/node
        run: pnpm run build

      - name: Configure package for GitHub Packages
        working-directory: plugins/swc/node
        run: |
          # Update package name to include scope for GitHub Packages
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.name = '@soundtrack/graphox-swc';
          pkg.publishConfig = { registry: 'https://npm.pkg.github.com' };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Publish SWC Plugin to GitHub Packages
        working-directory: plugins/swc/node
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-babel-plugin-github:
    name: Publish Babel Plugin to GitHub Packages
    needs: [create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@soundtrack'

      - name: Configure package for GitHub Packages
        working-directory: plugins/babel
        run: |
          # Update package name to include scope for GitHub Packages
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.name = '@soundtrack/graphox-babel';
          pkg.publishConfig = { registry: 'https://npm.pkg.github.com' };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Publish Babel Plugin to GitHub Packages
        working-directory: plugins/babel
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finalize-release:
    name: Finalize GitHub Release
    needs: [create-release, build-binaries, build-swc-wasm, build-vscode-extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Display structure of downloaded artifacts
        run: ls -R ./artifacts

      - name: Upload Assets to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          files: |
            ./artifacts/binary-*/*
            ./artifacts/swc-wasm/*
            ./artifacts/vscode-extension/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}