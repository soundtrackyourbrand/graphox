name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

# These workflows only build, lint and test. Declared explicitly so a fork
# pull request cannot inherit a broader default token scope.
permissions:
  contents: read

jobs:
  fmt:
    name: Format Check
    runs-on: ubicloud-standard-2-ubuntu-2404
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubicloud-standard-4-ubuntu-2404
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  dependencies:
    name: Dependencies
    runs-on: ubicloud-standard-2-ubuntu-2404
    steps:
      - uses: actions/checkout@v7

      # Only the deterministic cargo-deny checks run here. They depend on the
      # dependency graph alone, so they cannot fail because of something
      # published elsewhere today. Advisories run on a schedule instead, in
      # audit.yml, so a documentation change is never blocked by a CVE
      # disclosed that morning.
      - name: Check bans, licenses and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      # Parses source rather than compiling, so this needs no build cache.
      - name: Check for unused dependencies
        run: cargo machete

  check:
    name: Check
    runs-on: ubicloud-standard-4-ubuntu-2404
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run cargo check
        run: cargo check --all-targets --all-features

  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          [
            ubicloud-standard-4-ubuntu-2404,
            warp-macos-26-arm64-6x,
            warp-windows-2025-x64-4x,
          ]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Configure per-job Graphox cache directory
        run: |
          echo "GRAPHOX_CACHE_DIR=$RUNNER_TEMP/graphox-cache" >> $GITHUB_ENV
          mkdir -p "$RUNNER_TEMP/graphox-cache"
        shell: bash

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Build benchmarks
        run: cargo test --benches --all-features --no-run

      - name: Run memory tests
        if: runner.os == 'Linux'
        run: cargo test --test integration_suite long_running -- --nocapture --ignored

      # A separate step because the filter above is a name match, not "all
      # ignored tests": anything ignored outside long_running would silently
      # never run. These spawn the binary and wait on real filesystem events,
      # which is why they are ignored by default.
      - name: Run watcher tests
        if: runner.os == 'Linux'
        run: cargo test --test integration_suite codegen_watch -- --nocapture --ignored
