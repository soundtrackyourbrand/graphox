name: Plugins CI

on:
  push:
    paths:
      - 'plugins/**'
      - '.github/workflows/plugins.yml'
  pull_request:
    paths:
      - 'plugins/**'

# These workflows only build, lint and test. Declared explicitly so a fork
# pull request cannot inherit a broader default token scope.
permissions:
  contents: read

jobs:
  babel:
    runs-on: ubicloud-standard-2-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - run: cd plugins/babel && pnpm install --frozen-lockfile
      - run: cd plugins/babel && pnpm test

  swc:
    name: SWC Plugin
    runs-on: ubicloud-standard-4-ubuntu-2404
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install Node.js dependencies
        working-directory: plugins/swc/node
        run: pnpm install --frozen-lockfile

      - name: Build main binary
        run: cargo build --release

      - name: Run Integration Tests
        run: cargo test --test integration_suite swc_cli -- --ignored --nocapture

      - name: Build WASM
        working-directory: plugins/swc/node
        run: pnpm run build:wasm

      - name: Build TypeScript
        working-directory: plugins/swc/node
        run: pnpm run build

      - name: Run Node.js Tests
        working-directory: plugins/swc/node
        run: pnpm test
