[package]
name = "graphox-swc-plugin"
version = "0.9.0"
edition = "2024"
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
pathdiff = { workspace = true }
swc_core = { version = "56.0.0", features = [
  "common",
  "ecma_ast",
  "ecma_visit",
  "ecma_utils",
  "ecma_plugin_transform",
  "ecma_parser",
  "ecma_codegen",
] }

[dev-dependencies]
# `resolver` and `hygiene`, so tests can run the transform inside the pass
# pipeline a real build uses. Dev-only: it is not unified into the wasm build.
swc_core = { version = "56.0.0", features = ["ecma_transforms"] }
tempfile = "3.24.0"
ntest = "0.9"
serde_json = { workspace = true }
graphox = { path = "../../.." }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(swc_ast_unknown)'] }
