[package]
name = "graphox-swc-plugin"
version = "0.1.3"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
pathdiff = { workspace = true }
swc_core = { version = "56.0.0", features = [
    "common",
    "ecma_ast",
    "ecma_visit",
    "ecma_utils",
    "ecma_plugin_transform",
    "ecma_parser",
    "ecma_codegen",
] }
